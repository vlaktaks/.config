
add_newline = false
palette = "mythos"

format = """
[╭─](fg:dir_fg)$username$hostname$directory$git_branch$python
[╰─](fg:dir_fg)$character"""

right_format = ""

[palettes.mythos]
dir_bg = "#211f24"
git_bg = "#2b292f"
dir_fg = "#d0bcfe"
git_fg = "#ccc2db"
crimson = "#ffb4ab"
python_fg = "#a6e3a1"
host_fg = "#89b4fa"

[username]
show_always = true
style_user = "fg:dir_fg bold"
format = "[  $user]($style)"

[hostname]
ssh_only = false
style = "fg:host_fg bold"
format = "[ @󰒋 $hostname]($style)"

[directory]
style = "fg:dir_fg bold"
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"
read_only_style = "fg:crimson"
format = " [󰉋 $path]($style)[$read_only]($read_only_style)"

[git_branch]
symbol = "󰊢 "
style = "fg:git_fg bold"
format = " [$symbol$branch]($style)"
truncation_length = 32
truncation_symbol = "…"

[git_status]
disabled = true

[python]
symbol = "󰌠 "
style = "fg:python_fg bold"
format = " [$symbol$virtualenv]($style)"
python_binary = ["python", "python3", "python2"]
detect_extensions = ["py"]
detect_files = ["pyproject.toml", "requirements.txt", "Pipfile", "tox.ini", ".python-version"]
detect_folders = [".venv", "venv"]

[character]
success_symbol = "[❯](bold fg:dir_fg)"
error_symbol = "[❯](bold fg:crimson)"
vimcmd_symbol = "[❮](bold fg:dir_fg)"

[cmd_duration]
disabled = true

[package]
disabled = true

[time]
disabled = true

